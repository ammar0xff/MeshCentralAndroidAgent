name: Build MDM Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e305735c46f275c40148f" > $ANDROID_HOME/licenses/android-sdk-license
          echo "e9b71c4e0f8b7b6b0e6b6b6b6b6b6b6b6" > $ANDROID_HOME/licenses/android-sdk-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1

      - name: Create keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore app/mdm-release.keystore \
            -alias mdm \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Your Company, OU=IT, O=Your Company, L=City, S=State, C=Country"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "keystorePath=mdm-release.keystore" >> local.properties
          echo "keystorePassword=changeit" >> local.properties
          echo "keyAlias=mdm" >> local.properties
          echo "keyPassword=changeit" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          PAIR_TOKEN: ${{ secrets.PAIR_TOKEN }}
        run: ./gradlew assembleRelease --no-daemon -PserverUrl='$SERVER_URL' -PpairToken='$PAIR_TOKEN'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mdm-agent-apk
          path: app/build/outputs/apk/release/app-release.apk
