name: Build MDM Agent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/lib/android-sdk" >> local.properties

      - name: Create keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore mdm-release.keystore \
            -alias mdm \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Your Company, OU=IT, O=Your Company, L=City, S=State, C=Country"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "keystorePath=mdm-release.keystore" >> local.properties
          echo "keystorePassword=changeit" >> local.properties
          echo "keyAlias=mdm" >> local.properties
          echo "keyPassword=changeit" >> local.properties
          echo "serverUrl=${{ secrets.SERVER_URL }}" >> local.properties
          echo "pairToken=${{ secrets.PAIR_TOKEN }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mdm-agent-apk
          path: app/build/outputs/apk/release/app-release.apk
