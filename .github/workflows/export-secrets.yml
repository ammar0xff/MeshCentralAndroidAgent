name: export-secrets
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets to files
        env:
          ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          PAIR_TOKEN: ${{ secrets.PAIR_TOKEN }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          mkdir -p out
          printf '%s' "$ANDROID_SIGNING_KEY_B64" > out/ANDROID_SIGNING_KEY_B64
          printf '%s' "$SERVER_URL" > out/SERVER_URL
          printf '%s' "$PAIR_TOKEN" > out/PAIR_TOKEN
          printf '%s' "$ADMIN_USER" > out/ADMIN_USER
          printf '%s' "$ADMIN_PASSWORD" > out/ADMIN_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-export
          path: out/
          retention-days: 1
