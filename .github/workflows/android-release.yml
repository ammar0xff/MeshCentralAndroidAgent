name: Android Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Android release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
        run: |
          # Same contract as build.yml: the repo-stable keystore, decoded where
          # gradle.properties points (app/mdm-release.keystore, alias mdm,
          # storepass changeit). Publishing under a throwaway key would break
          # in-place upgrades, so a missing secret fails the release loudly.
          if [ -z "$ANDROID_SIGNING_KEY_B64" ]; then
            echo "Missing required GitHub Actions secret: ANDROID_SIGNING_KEY_B64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEY_B64" | base64 --decode > app/mdm-release.keystore

      - name: Build release APK and AAB
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"

          if [[ -z "$APP_VERSION" || "$APP_VERSION" == "null" ]]; then
            echo "Unable to read versionName from the release APK metadata."
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$APP_VERSION" ]]; then
            echo "Tag '$GITHUB_REF_NAME' must match Android versionName '$APP_VERSION'."
            exit 1
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk "release/MeshCentral-Agent-${APP_VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/MeshCentral-Agent-${APP_VERSION}.aab"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.aab
